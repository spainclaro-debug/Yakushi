name: Android APK

# Builds the sideloadable arm64-v8a debug APKs of Yakushi Server (the standalone
# Tanoshi Android app) and Yashi (its companion browser/client), uploads them as
# workflow artifacts and, for Android release tags (android-v*), publishes both
# on a GitHub release. Termux package releases
# use v* tags and are not touched by this workflow.
#
# The native binaries under android/app/src/main/jniLibs/arm64-v8a/ are
# prebuilt and committed, so this workflow only runs the Gradle app build - it
# needs no Rust or Android NDK toolchain. To rebuild the native pieces, see
# android/native/README.md.

on:
  push:
    branches:
      - "**"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing a release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Compute app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NAME=""
          CODE=""
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF_NAME#android-v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
            # versionCode = major*10000 + minor*100 + patch (e.g. 0.2.0 -> 200)
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          # Yashi has its own version line, independent from the server tag.
          echo "yashi_name=${YASHI_VERSION_NAME:-0.1.4}" >> "$GITHUB_OUTPUT"
          echo "yashi_code=${YASHI_VERSION_CODE:-104}" >> "$GITHUB_OUTPUT"
          echo "Building Yakushi '${NAME:-0.16.4 (default)}' code '${CODE:-1604 (default)}', Yashi '${YASHI_VERSION_NAME:-0.1.4}' code '${YASHI_VERSION_CODE:-104}'"

      - name: Build debug APKs
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          YASHI_VERSION_NAME: ${{ steps.version.outputs.yashi_name }}
          YASHI_VERSION_CODE: ${{ steps.version.outputs.yashi_code }}
          APK_DATE: ${{ steps.version.outputs.apk_date }}
        run: |
          chmod +x ./gradlew
          NAME="${APP_VERSION_NAME:-0.16.4}"
          CODE="${APP_VERSION_CODE:-1604}"
          YASHI_NAME="${YASHI_VERSION_NAME:-0.1.4}"
          YASHI_CODE="${YASHI_VERSION_CODE:-104}"
          ./gradlew :app:assembleDebug :yashi:assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$NAME" -PappVersionCode="$CODE" \
            -PyashiVersionName="$YASHI_NAME" -PyashiVersionCode="$YASHI_CODE" \
            -PapkDate="$APK_DATE"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: yakushi-yashi-debug-apks
          path: |
            android/app/build/outputs/apk/debug/yakushi-server-release-*.apk
            android/yashi/build/outputs/apk/debug/yashi-client-release-*.apk
          if-no-files-found: error
          retention-days: 30

      # Android releases are tagged android-v* (e.g. android-v0.16.4). The
      # release is created with the preinstalled GitHub CLI so the workflow
      # needs no third-party release action.
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Yakushi Server 0.16.4 is the standalone arm64-v8a Android app that bundles and runs the Yakushi manga server (no Termux). This release also introduces **Yashi 0.1.4**, a companion browser client for connecting to a Yakushi server from another Android device: camera QR scanning on first launch, an address bar + history + saved servers with edit/delete, LAN discovery, dark/light/system themes, clear-data settings, and a full-screen WebView with a floating back button (hidden in the catalogue and manga reader). 0.1.4 fixes saving an IP/port crashing the app (duplicate LazyColumn keys when a saved server is also in history), local-network discovery (active-network IPv4, /health probe, ports 8080/18084/8000/3000 plus saved/history ports, clearer empty-state), and restricts the start-screen top inset to the visible status bar so fullscreen/cutout mode has no leftover padding; the server web reader's paged Single/Double/Auto rendering was also rebuilt to render the current page(s) directly and avoid borrow panics, fixing blank paged pages and unresponsive mode switching. Yakushi Server 0.16.4 includes all 0.15.1 fixes (seamless continuous reading read-status), pinned catalogue sources, hot extension reload and all earlier features. Install: download yakushi-server-release-<date>.apk for the server app and/or yashi-client-release-<date>.apk for the client; sideload them. Existing Yakushi installs update from Settings -> Updates. See android/CHANGELOG.md, android/README.md and the Yashi section in README.md."
          APK_DIR=android/app/build/outputs/apk/debug
          YASHI_DIR=android/yashi/build/outputs/apk/debug
          gh release create "$TAG" \
            "$APK_DIR"/yakushi-server-release-*.apk \
            "$YASHI_DIR"/yashi-client-release-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yakushi Server 0.16.4 + Yashi 0.1.4" \
            --notes "$NOTES"
